[package]
name = "cv-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
# Integration tests are one binary (tests/main.rs): see there.
autotests = false
description = "B9: the code-viewer agent interface (MCP tools, profiles, resources, prompts) on rmcp"

[[bin]]
name = "cv-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
cv-contracts.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "io-std"] }
axum.workspace = true
futures.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util", "process"] }

[[test]]
name = "it"
path = "tests/main.rs"
