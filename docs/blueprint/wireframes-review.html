<figcaption><h4>File chips, and a range review on the full view's map</h4>
<p>Left: every split file carries its own chip colour, muted until you select the file. Then its chips and outlines brighten, the rest dims, and the minimap marks every fragment. Right: a range review keeps the full view's map, so diff windows sit where their code always sits, and unchanged connected functions stay one click away.</p>
<ol class="wf-legend">
<li><b>Chip at rest</b> — one colour per split file, stable per path; muted so it reads as identity, not heat. <span class="ws f">F1</span> <span class="ws">B3</span> <code>WindowHeader.fragment</code> (chip)</li>
<li><b>Selected file</b> — its chips and outlines go more saturated and brighter; other windows dim. <span class="ws f">F1</span> <code>ws: view.state</code> (selectedFile)</li>
<li><b>Off-screen fragments</b> — listed in a chip; <code>]f</code> and <code>[f</code> jump between fragments. <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/fragments?path=</code></li>
<li><b>Minimap</b> — every fragment of the selected file marked in its bright colour, including off-screen ones. <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/fragments?path=</code></li>
<li><b>Palette</b> — 10 slots at 36° apart; selection raises lightness and chroma. <span class="ws c">C0</span> <code>wire.ts FILE_CHIP_SLOTS</code></li>
<li><b>Same map as the full view</b> — lanes, heat columns, connectedness rows and cluster positions come from the snapshot of the range tip. <span class="ws">B6</span> <code>ViewRef.sharedPlacement</code></li>
<li><b>Diff windows</b> — one window per hunk cluster, with in-range activity as a badge and per-line owner stripes instead of position. <span class="ws f">F3</span> <span class="ws">B6</span> <code>WindowDiff</code> <code>Heat.inRange</code></li>
<li><b>Minimized context</b> — unchanged functions the diff calls or is called by: header-only pills with name and dependents. <span class="ws f">F3</span> <code>RangeOptions.contextDisplay</code> <code>WindowHeader.flags.minimized</code></li>
<li><b>Expanded in place</b> — a click opens the pill as an overlay with its outline; nothing is relaid. <span class="ws f">F3</span></li>
<li><b>Unchanged clusters</b> — faint outlines in their full-view cells keep orientation; Fit frames only the change. <span class="ws f">F1</span> <span class="ws">B6</span></li>
</ol></figcaption></figure>
