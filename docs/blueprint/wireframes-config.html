<figcaption><h4>Config field usage</h4>
<p>Config files get their own lane, and every key line that code reads carries a port. The links come from a scored heuristic, not a parser of every loader, so their confidence is drawn: solid when the evidence is strong, faded with "?" when it is thin.</p>
<ol class="wf-legend">
<li><b>Config window</b> — one window per YAML, TOML or JSON file (or per top-level block in big ones); every key path is known with its line. <span class="ws l">L3</span> <code>ConfigKeyFact</code></li>
<li><b>Field ports</b> — on each key line that has readers, with the reader count or the single reader's name. <span class="ws f">F3</span> <span class="ws p">P5</span></li>
<li><b>Family hub</b> — one hub per file family and key: 237 <code>node.yaml</code> files define <code>capacity</code>, and the generic loader that reads it appears once, not 237 times. A hub with one definer and one reader is drawn as a direct edge. <span class="ws p">P5</span> <code>Hub.family</code></li>
<li><b>Loader evidence</b> — code that mentions the config file's name or path gets a higher score for every key of that family. <span class="ws p">P5</span> <code>LinkContext.mentions</code></li>
<li><b>Strong link</b> — an access with a string literal in the same directory, for a rare key: drawn solid. <span class="ws p">P5</span> <span class="ws f">F1</span> <code>Link.confidence</code></li>
<li><b>Weak link</b> — generic keys score half, so <code>trigger</code> read in unrelated code stays faded with "?"; <code>rate_link</code> confirms or removes it. <span class="ws p">P5</span> <span class="ws">B9</span> <code>rate_link</code></li>
</ol></figcaption></figure>
