<figcaption><h4>Main screen (desktop)</h4>
<p>The canvas owns the screen and the chrome stays thin. Everything drawn at Outline zoom comes from the view bootstrap, viewport tiles and per-window outline parts, never from file text.</p>
<ol class="wf-legend">
<li><b>View switcher</b> — Snapshot or Range, plus the revision/revset chip; changing either opens a new view. <span class="ws f">F4</span> <code>POST /api/v1/views</code> <code>GET /api/v1/revisions?revset&amp;limit</code></li>
<li><b>Search</b> — symbols, files, topics, endpoints and threads; Enter flies the camera to the hit. <span class="ws f">F4</span> <code>GET /api/v1/search?q</code></li>
<li><b>Link filters</b> — toggle edge kinds on the client; the kinds present in a view arrive with it. <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/bootstrap</code></li>
<li><b>Heat legend</b> — the five churn grades, how many commits were scanned and how settled the grading is. <span class="ws f">F4</span> <span class="ws">B5</span> <code>GET /api/v1/views/{id}/bootstrap</code></li>
<li><b>Agent status</b> — what the connected agent is doing right now. <span class="ws f">F4</span> <code>ws: agent.attention</code></li>
<li><b>Clusters and windows</b> — regions from dependency clustering; a file's windows stack in source order inside a dashed file group; silhouettes stand in for text. <span class="ws f">F1</span> <span class="ws f">F2</span> <code>GET /api/v1/views/{id}/tiles/{z}/{x}/{y}</code> <code>POST /api/v1/views/{id}/windows:batch</code> (outline)</li>
<li><b>Port pills</b> — outgoing on the right edge at the callsite line, incoming on the left edge at the definition line. <span class="ws f">F1</span> <code>POST /api/v1/views/{id}/windows:batch</code> (ports)</li>
<li><b>Hubs and edges</b> — topic hub <code>order.item.shipped</code> and endpoint hub <code>GET /api/item/{}</code>; edges are styled by kind. <span class="ws f">F1</span> <span class="ws">B4</span> <code>GET /api/v1/views/{id}/bootstrap</code> (hubs) <code>GET /api/v1/links?viewId&amp;target&amp;dir&amp;kinds&amp;depth</code></li>
<li><b>Thread and conflict markers</b> — gutter bubble with a count (agent-authored threads use the agent pen); × in the header when the window's commit is conflicted. <span class="ws f">F3</span> <code>GET /api/v1/threads</code> <code>GET /api/v1/conflicts?revset</code> <code>ws: thread.upserted · conflicts.changed</code></li>
<li><b>Agent presence</b> — dashed outline and pin on the window the agent last read, with the tool it used. <span class="ws f">F1</span> <code>ws: agent.attention</code></li>
<li><b>Minimap and zoom</b> — cluster boxes tinted by heat, the viewport frame, and +, −, Fit. <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/bootstrap</code></li>
<li><b>Side panel</b> — History, Review, Workspaces, Hotspots and Agent tabs (three drawn here); History is the jj graph with the current range shaded and each workspace's @ listed. <span class="ws f">F4</span> <code>GET /api/v1/revisions?revset&amp;limit</code> <code>ws: op.changed · view.state</code></li>
<li><b>Status bar</b> — zoom tier, visible and total windows, loads in flight, operation id and index state. <span class="ws f">F2</span> <code>ws: index.progress · op.changed</code></li>
</ol></figcaption></figure>

<figcaption><h4>Zoom tiers and data tiers</h4>
<p>Each zoom tier adds detail and pulls in one more data tier. Panning never waits on the network: a frame draws whatever is cached and the loader fills in behind it.</p>
<ol class="wf-legend">
<li><b>L0 Galaxy</b> — cluster regions tinted by heat, bundled edges with counts, hub glyphs, thread and conflict totals per cluster. <span class="ws f">F1</span> <span class="ws f">F2</span> <code>GET /api/v1/views/{id}/bootstrap</code></li>
<li><b>L1 Map</b> — every window as a titled tile; headers arrive per quadtree tile and are cached by tile key. <span class="ws f">F2</span> <code>GET /api/v1/views/{id}/tiles/{z}/{x}/{y}</code></li>
<li><b>L2 Outline</b> — silhouettes at a few bytes per line, labelled port pills, thread markers; a skeleton shows while T2 is in flight. <span class="ws f">F2</span> <span class="ws f">F1</span> <code>POST /api/v1/views/{id}/windows:batch</code> (outline, ports)</li>
<li><b>L3 Code</b> — text and highlight tokens from immutable blob ranges, port pills on their lines, fades with expand hints; neighbours keep their silhouette until their text lands. <span class="ws f">F3</span> <code>GET /api/v1/blobs/{blobId}/text?from&amp;to</code> <code>GET /api/v1/threads?path</code></li>
<li><b>Loader rules</b> — tier thresholds with hysteresis, priority by distance to the predicted viewport, cancellation, and refetch when the server invalidates parts. <span class="ws f">F2</span> <code>ws: view.invalidated</code></li>
</ol></figcaption></figure>

<figcaption><h4>Code window anatomy (L3)</h4>
<p>One window focuses on one function or one diff cluster and shows at most 500 lines. Context beyond its range fades to black at either edge, and the hint loads more on request.</p>
<ol class="wf-legend">
<li><b>Header</b> — dimmed directory, file name, symbol, change id with its shortest prefix in bold, heat grade with a touch sparkline, thread count and conflict state. <span class="ws f">F3</span> <code>GET /api/v1/views/{id}/tiles/{z}/{x}/{y}</code> (WindowHeader)</li>
<li><b>Top blackout and expand hint</b> — the window starts mid-file, so its first lines fade out; +20 or to class start asks for more context. <span class="ws f">F3</span> <code>POST /api/v1/views/{id}/windows/{wid}/expand</code> (before)</li>
<li><b>Incoming port</b> — on the left edge at the definition line, with the caller count; a click lists the callers. <span class="ws f">F3</span> <span class="ws f">F1</span> <code>GET /api/v1/links?viewId&amp;target&amp;dir&amp;kinds&amp;depth</code> (dir=in)</li>
<li><b>Callsites and outgoing ports</b> — the call token is underlined in its link colour and its pill sits on the right edge at the same line; a click flies to the target. <span class="ws f">F3</span> <code>POST /api/v1/views/{id}/windows:batch</code> (ports)</li>
<li><b>Gutter +</b> — appears on the hovered line; drag to widen the range before commenting. <span class="ws f">F3</span> <code>POST /api/v1/threads</code></li>
<li><b>Inline thread</b> — GitHub-style thread under its anchored lines, the suggestion shown as a diff, assignee and status; Send to agent queues it for the MCP loop. <span class="ws f">F3</span> <span class="ws">B8</span> <code>POST /api/v1/threads/{id}/comments</code> <code>PATCH /api/v1/threads/{id}</code> <code>POST /api/v1/reviews:submit</code> <code>ws: thread.upserted</code></li>
<li><b>Bottom blackout and the 500-line cap</b> — the hint says how much remains and loads more on request; long bodies can fold. <span class="ws f">F3</span> <code>POST /api/v1/views/{id}/windows/{wid}/expand</code> (after)</li>
<li><b>Text and tokens</b> — code arrives as an immutable, content-addressed line range with highlight tokens, so the browser cache keeps it. <span class="ws f">F2</span> <span class="ws f">F3</span> <code>GET /api/v1/blobs/{blobId}/text?from&amp;to</code></li>
</ol></figcaption></figure>

<figcaption><h4>Links, ports and hubs</h4>
<p>Every link starts at a port on the line where it happens. Many-to-many channels (event topics, HTTP endpoints) get a hub, so N producers and M consumers draw N + M edges rather than N × M.</p>
<ol class="wf-legend">
<li><b>Outgoing port</b> — on the right edge at the callsite line; the token itself is underlined in the link colour. <span class="ws f">F1</span> <code>POST /api/v1/views/{id}/windows:batch</code> (ports)</li>
<li><b>Incoming port</b> — on the left edge at the definition line. <span class="ws f">F1</span> <code>POST /api/v1/views/{id}/windows:batch</code> (ports)</li>
<li><b>Fan-out</b> — one callsite with several targets shows one pill with a count; hover lists the targets. <span class="ws f">F1</span> <span class="ws">B4</span> <code>GET /api/v1/links?viewId&amp;target&amp;dir&amp;kinds&amp;depth</code></li>
<li><b>Topic hub</b> — keyed by the resolved topic, with producer and consumer counts; agents read it through <code>get_hub</code>. <span class="ws">B4</span> <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/bootstrap</code> (hubs)</li>
<li><b>Wildcard subscriber</b> — <code>order.#</code> attaches to every hub it matches (MQTT style: * is one segment, # is the rest). <span class="ws">B4</span> <code>GET /api/v1/links?viewId&amp;target&amp;dir&amp;kinds&amp;depth</code></li>
<li><b>Dispatch</b> — a dotted edge from the subscription site to the handler it registers. <span class="ws">B4</span> <code>POST /api/v1/views/{id}/windows:batch</code> (ports)</li>
<li><b>Endpoint hub</b> — client calls and routes meet on method plus normalized path, across languages; wrapper prefixes come from rule packs. <span class="ws">B4</span> <span class="ws f">F1</span> <code>GET /api/v1/views/{id}/bootstrap</code> (hubs)</li>
<li><b>Link kinds</b> — each link carries kind, confidence and source (static rule, precise index, agent), which select the stroke; a key that only exists at runtime ends in an open "?" stub. <span class="ws">B4</span> <span class="ws f">F1</span> <code>GET /api/v1/links?viewId&amp;target&amp;dir&amp;kinds&amp;depth</code></li>
<li><b>Off-screen portal</b> — an edge whose target is outside the viewport ends in a chip at the edge; clicking flies there and leaves a back crumb. <span class="ws f">F1</span></li>
</ol></figcaption></figure>

<figcaption><h4>Version tree (History tab)</h4>
<p>The tree reads like <code>jj log</code>, plus what review needs: thread counts, conflicts, every workspace's working copy, and whether a change moved since you last reviewed it.</p>
<ol class="wf-legend">
<li><b>Graph lanes</b> — jj's own glyphs: @ working copy, ○ mutable, ◆ immutable, × conflicted, ⋯ elided. <span class="ws f">F4</span> <code>GET /api/v1/revisions?revset&amp;limit</code></li>
<li><b>Change ids</b> — shortest unique prefix in bold, as jj prints them; they stay stable across rewrites, so threads follow the change. <span class="ws f">F4</span> <span class="ws">B1</span> <code>GET /api/v1/revisions?revset&amp;limit</code></li>
<li><b>Bookmarks and workspaces</b> — each workspace's working copy is listed, so other agents' stacks are visible next to yours. <span class="ws f">F4</span> <span class="ws">B1</span> <code>GET /api/v1/revisions?revset&amp;limit</code></li>
<li><b>Badges</b> — open thread counts and conflict state per change. <span class="ws f">F4</span> <code>GET /api/v1/threads</code> <code>GET /api/v1/conflicts?revset</code></li>
<li><b>Changed since review</b> — the change was rewritten after you marked it reviewed; opens an interdiff view from the reviewed commit to the current one. <span class="ws f">F4</span> <span class="ws">B8</span> <code>GET /api/v1/interdiff?change&amp;from</code></li>
<li><b>Range selection</b> — click a row for a snapshot, shift-click a second row for a range; the tip and base handles show what the diff compares. <span class="ws f">F4</span> <code>ws: view.state</code> <code>POST /api/v1/views</code></li>
<li><b>Range… and Review range</b> — open the range dialog, or review the shaded selection directly. <span class="ws f">F4</span> <code>POST /api/v1/views</code></li>
<li><b>Live updates</b> — a new jj operation refreshes the rows in place. <span class="ws f">F4</span> <code>ws: op.changed</code></li>
</ol></figcaption></figure>

<figcaption><h4>Range dialog</h4>
<p>The revset is the source of truth: presets, the commit picker and saved ranges all just rewrite it, and the server validates every keystroke against the real repo.</p>
<ol class="wf-legend">
<li><b>Revset input</b> — validated as you type; the line under it counts commits and files and shows the line delta. <span class="ws f">F4</span> <span class="ws">B1</span> <code>POST /api/v1/revsets:validate</code></li>
<li><b>Error state</b> — jj's own parse error with a suggestion; Apply stays disabled. <span class="ws f">F4</span> <code>POST /api/v1/revsets:validate</code></li>
<li><b>Presets</b> — my stack, mine, one per agent workspace, last 10, a single change. <span class="ws f">F4</span> <code>GET /api/v1/repo</code> (workspaces)</li>
<li><b>Saved ranges</b> — named revset, fileset and options. <span class="ws f">F4</span> <code>GET /api/v1/ranges</code></li>
<li><b>Commit picker</b> — toggling rows rewrites the revset; tip and base show what the diff compares. <span class="ws f">F4</span> <code>GET /api/v1/revisions?revset&amp;limit</code></li>
<li><b>Gap warning</b> — the selection skips a commit whose descendants are included; fill the gap or review per commit. <span class="ws f">F4</span> <span class="ws">B1</span> <code>POST /api/v1/revsets:validate</code> (gaps)</li>
<li><b>Paths</b> — a jj fileset narrows which files become windows. <span class="ws f">F4</span> <code>POST /api/v1/revsets:validate</code> (fileset)</li>
<li><b>Options</b> — cumulative or per-commit diff, context windows 0–2 hops, whitespace handling. <span class="ws f">F4</span> <span class="ws c">C0</span> ViewSpec fields</li>
<li><b>Apply</b> — creates the range view and switches the canvas to it. <span class="ws f">F4</span> <span class="ws">B6</span> <code>POST /api/v1/views</code> (ViewSpec → ViewRef)</li>
</ol></figcaption></figure>

<figcaption><h4>Editing a past change</h4>
<p>An edit in a window anchored to an older change goes in at the right place in the stack. The preview shows what will be rebased and where conflicts are likely before anything is written, and conflicts that do appear can go to the agent.</p>
<ol class="wf-legend">
<li><b>Edit at a past change</b> — the window shows the file as of <code>kxwqmnpo</code>; Save as defaults to amend (a new branch when the commit is immutable). <span class="ws f">F3</span> <span class="ws">B8</span> <code>POST /api/v1/edits</code></li>
<li><b>Preview</b> — a dry run rewrites inside a jj-lib transaction and drops it, so the rebased descendants, affected workspaces and conflicts are exact. <span class="ws f">F3</span> <span class="ws">B8</span> <code>POST /api/v1/edits</code> (dryRun)</li>
<li><b>Applied</b> — the amended change keeps its id, conflicted descendants get ×, and a conflict window opens with both sides. <span class="ws f">F4</span> <span class="ws f">F3</span> <code>ws: edit.updated · conflicts.changed</code> <code>GET /api/v1/conflicts/{commit}/{path}</code></li>
<li><b>Agent resolves</b> — Ask agent files a task thread on the conflict and sends it; the agent resolves it over MCP and the × clears. <span class="ws">B9</span> <span class="ws">B8</span> <code>POST /api/v1/threads</code> (kind task) <code>POST /api/v1/reviews:submit</code> <code>resolve_conflict</code></li>
<li><b>Write rule</b> — affected workspaces are snapshotted before the write and updated after; undo reverts our operation only (the CLI recipes stay as the test oracle). <span class="ws">B1</span> <span class="ws">B8</span> <code>POST /api/v1/edits/{id}/undo</code></li>
</ol></figcaption></figure>

<figcaption><h4>Agent review loop</h4>
<p>Review comments become the agent's work queue. The agent finds work through the event log, reads and edits by stable ids, and every write lands as one jj operation the human can interdiff and undo.</p>
<ol class="wf-legend">
<li><b>Review comment</b> — the human comments with a suggestion, assigns the agent and sends the batch. <span class="ws f">F3</span> <span class="ws">B8</span> <code>POST /api/v1/threads</code> <code>POST /api/v1/reviews:submit</code></li>
<li><b>Event log</b> — the server appends <code>review.submitted</code>; the agent's long-poll returns it. <span class="ws">B7</span> <span class="ws">B9</span> <code>wait_for_events</code></li>
<li><b>Agent reads</b> — the thread with its anchored code, then the window with its ports, all by stable ids. <span class="ws">B9</span> <code>get_thread</code> <code>read_window</code></li>
<li><b>Presence</b> — each read moves the agent marker on the human's canvas. <span class="ws">B7</span> <span class="ws f">F1</span> <code>ws: agent.attention</code></li>
<li><b>Edit through the mutation queue</b> — <code>edit_code</code> becomes one jj operation (an amend), with affected workspaces snapshotted first. <span class="ws">B9</span> <span class="ws">B8</span> <span class="ws">B1</span> <code>POST /api/v1/edits</code></li>
<li><b>Realtime updates</b> — the new operation refreshes the tree; the thread turns Addressed and the change shows changed since review. <span class="ws">B7</span> <span class="ws f">F4</span> <code>ws: op.changed · edit.updated · thread.upserted</code></li>
<li><b>Interdiff and resolve</b> — the human reviews only what changed since their review, then resolves the thread. <span class="ws f">F4</span> <span class="ws">B8</span> <code>GET /api/v1/interdiff?change&amp;from</code> <code>PATCH /api/v1/threads/{id}</code></li>
</ol></figcaption></figure>
