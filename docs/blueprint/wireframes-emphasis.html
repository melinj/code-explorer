>env:TAX_API_URL</text><path class="hub-e" d="M373 298L381 306L373 314L365 306Z"/><text class="s m te" x="386" y="310">order.sweep</text><text class="s b end e-tg" x="572" y="276">deploy</text><text class="s m d end" x="572" y="290">CMD python main.py</text><text class="s m end e-tg" x="955" y="572">ci · run: pytest</text><path class="e-cam" d="M142 352V340H154M356 340H368V352M142 384V396H154M356 396H368V384"/><text class="s b e-ta" x="146" y="354">camera lands here · Review first</text><text class="s" x="150" y="719">Docs · 1,093 files · collapsed</text><rect class="pg" x="1040" y="706" width="62" height="18" rx="4"/><text class="s mid" x="1071" y="719">Expand</text><text class="s d" x="12" y="750">Clusters keep their dependency layout inside a cell and change cell only when a grade settles, so the map stays stable as history accumulates.</text><g class="wf-callout" transform="translate(1104 40)"><circle r="9"/><text y="4">1</text></g><g class="wf-callout" transform="translate(200 114)"><circle r="9"/><text y="4">2</text></g><g class="wf-callout" transform="translate(60 150)"><circle r="9"/><text y="4">3</text></g><g class="wf-callout" transform="translate(560 457)"><circle r="9"/><text y="4">4</text></g><g class="wf-callout" transform="translate(330 380)"><circle r="9"/><text y="4">5</text></g><g class="wf-callout" transform="translate(220 598)"><circle r="9"/><text y="4">6</text></g><g class="wf-callout" transform="translate(874 330)"><circle r="9"/><text y="4">7</text></g><g class="wf-callout" transform="translate(594 262)"><circle r="9"/><text y="4">8</text></g><g class="wf-callout" transform="translate(946 202)"><circle r="9"/><text y="4">9</text></g><g class="wf-callout" transform="translate(396 330)"><circle r="9"/><text y="4">10</text></g><g class="wf-callout" transform="translate(1026 715)"><circle r="9"/><text y="4">11</text></g></svg></div><figcaption><h4>District grid: both axes and the lanes</h4>
<p>Position carries both axes: columns are change frequency, rows are connectedness, and bands separate infrastructure, config, code, tests and docs. A cluster changes cell only when its grade settles, so the map stays put as history accumulates. Lane file counts are the reference repo's; cluster placements are illustrative.</p>
<ol class="wf-legend">
<li><b>Heat columns</b> — change-frequency grades shared by every lane, so a column means the same thing everywhere; column widths line up across lanes. <span class="ws f">F1</span> <span class="ws">B6</span> <code>GET /api/v1/views/{id}/bootstrap</code> (lanes)</li>
<li><b>Lane bands</b> — infrastructure, config, code, tests and docs each get a band; texture and the rail name the lane, never hue, so colour stays free for heat. <span class="ws">B3</span> <span class="ws f">F1</span> <code>.cv/lanes.toml</code> <code>Cluster.lane</code></li>
<li><b>Connectedness rows</b> — per lane, Core to Isolated, graded by dependents within two hops (direct, or through one intermediary) over calls, inheritance, imports, topics, endpoints and config keys. Transitive reach saturates in import cycles, so it is only a tooltip detail. <span class="ws">B4</span> <span class="ws">B6</span> <code>Cluster.conn</code> (dependents2)</li>
<li><b>Cluster in its cell</b> — tinted by its heat grade and raised by its connectedness grade (plinth and frame weight); the dependency layout inside the cluster is unchanged. <span class="ws f">F1</span> <span class="ws">B6</span> <code>Cluster.lane</code> <code>Cluster.conn</code></li>
<li><b>Review first</b> — Code × Hot × Core: the camera lands here when a view opens, and the double outline marks the top 5% by risk. <span class="ws f">F1</span> <span class="ws">B6</span> <code>GET /api/v1/views/{id}/metrics?level=cluster|file&amp;lane=</code></li>
<li><b>Collapsed rows</b> — connectedness rows a lane does not use shrink to a thin gap (Tests has no Core or High clusters); columns never collapse, so they stay aligned. <span class="ws">B6</span></li>
<li><b>Env hub on the lane boundary</b> — <code>env:TAX_API_URL</code>: <code>.env.example</code> and the compose <code>environment:</code> block provide it, <code>src/config.py</code> reads it. <span class="ws">B3</span> <span class="ws">B4</span> <code>GET /api/v1/views/{id}/bootstrap</code> (hubs)</li>
<li><b>Deploy link</b> — the Dockerfile's <code>CMD</code> runs <code>main.py</code>, so infrastructure connects to the code it ships. <span class="ws">B3</span> <span class="ws">B4</span></li>
<li><b>CI link</b> — <code>run: pytest</code> in the CI workflow points at the Tests lane. <span class="ws">B3</span> <span class="ws">B4</span></li>
<li><b>Topic declared in config</b> — <code>order.sweep</code> is wired in workflow YAML and consumed by <code>order · checkout</code>; links that cross lanes are bundled per cluster pair. <span class="ws">B4</span> <span class="ws f">F1</span></li>
<li><b>Docs, collapsed</b> — a thin band with a count until expanded; lane filters hide or show whole bands. <span class="ws f">F1</span> <span class="ws f">F4</span> <code>GET /api/v1/views/{id}/bootstrap</code> (lanes)</li>
</ol></figcaption></figure>

circle r="9"/><text y="4">6</text></g><g class="wf-callout" transform="translate(866 88)"><circle r="9"/><text y="4">7</text></g><g class="wf-callout" transform="translate(168 449)"><circle r="9"/><text y="4">8</text></g><g class="wf-callout" transform="translate(205 46)"><circle r="9"/><text y="4">9</text></g><g class="wf-callout" transform="translate(390 243)"><circle r="9"/><text y="4">10</text></g><g class="wf-callout" transform="translate(1098 328)"><circle r="9"/><text y="4">11</text></g></svg></div><figcaption><h4>Encodings, lenses and file fragments</h4>
<p>Each axis gets its own visual channel so the two never compete: hue is change frequency, elevation is connectedness, texture is the lane. Lenses re-weight the same picture without moving anything, and a file split across clusters stays findable through its chip.</p>
<ol class="wf-legend">
<li><b>Heat</b> — the top strip and the silhouette bars take the heat hue; cold code draws grey-blue. <span class="ws f">F1</span> <code>WindowHeader.heat</code></li>
<li><b>District glyph</b> — a 5×5 map in the header: column is the heat grade, row the connectedness grade, so a window shows its grid cell at any zoom. <span class="ws f">F1</span> <code>WindowHeader.conn</code></li>
<li><b>Dependents, fan-out, tests</b> — ↧ counts windows that depend on this one directly or through one intermediary, ↥ what it uses directly; test dependents are counted apart as coverage, not connectedness. Transitive reach and import-cycle size stay in the tooltip. <span class="ws f">F1</span> <span class="ws">B4</span> <code>WindowHeader.conn</code> (dependents2, fanOut, tests)</li>
<li><b>Elevation</b> — plinth offset and frame weight grow with the connectedness grade, so central code looks raised. <span class="ws f">F1</span></li>
<li><b>Review first</b> — a double accent outline on the top 5% by risk, the geometric mean of the heat and connectedness percentiles. <span class="ws f">F1</span> <span class="ws">B6</span> <code>WindowHeader.reviewFirst</code></li>
<li><b>Lens switcher</b> — None, Heat, Connectedness, Hotspots, Co-change; lenses run on the client and never move anything. <span class="ws f">F4</span> <code>ws: view.state</code> (lens)</li>
<li><b>Lenses side by side</b> — what each lens fades, lights or thickens; co-change pairs come from the history miner and join files that change together without a static link. <span class="ws f">F1</span> <span class="ws">B5</span> <code>GET /api/v1/views/{id}/metrics?level=cluster|file&amp;lane=</code> (cochange)</li>
<li><b>Lane textures</b> — hatch for infra, dots for config, plain for code, lines for tests, crosses for docs. <span class="ws">B3</span> <span class="ws f">F1</span> <code>.cv/lanes.toml</code></li>
<li><b>File chip</b> — on every window of a file split into several windows: an outlined pill with a pastel identity stripe (a fixed slot per path, never a heat colour) and the fragment number. <span class="ws f">F1</span> <span class="ws">B6</span> <code>WindowHeader.fragment</code> (index, of, chip)</li>
<li><b>Dynamic link</b> — a port whose key is only known at runtime ends in an open dashed stub with a ?, and says why. <span class="ws">B4</span> <span class="ws f">F1</span> <code>Link.to.dynamic</code> (hint)</li>
<li><b>File selected</b> — clicking a chip outlines every fragment of the file in accent, dims the rest and joins the fragments with dotted links across clusters; fragments attract each other in layout. <span class="ws f">F1</span> <span class="ws">B6</span> <code>ws: view.state</code> (selectedFile) <code>FileFragment.siblings</code></li>
</ol></figcaption></figure>

>
<p>Every jj workspace gets a card: whose it is, what its stack holds, what is not yet snapshotted, and where it collides with another workspace. Opening a workspace shows its live files on the canvas, and each agent's presence is labelled with the workspace it works in.</p>
<ol class="wf-legend">
<li><b>Workspaces tab</b> — one card per jj workspace, kept live as operations land and files change. <span class="ws f">F4</span> <span class="ws">B7</span> <code>GET /api/v1/workspaces</code> <code>ws: workspace.updated</code></li>
<li><b>Card header</b> — name, checkout path and who works there: you, or an agent session bound to the workspace. <span class="ws f">F4</span> <span class="ws">B9</span> <code>WorkspaceSummary.serving</code> <code>WorkspaceSummary.agent</code> <code>bind_workspace</code></li>
<li><b>@ and stack</b> — the workspace's working-copy change with its prefix in bold, and the size of <code>trunk()..name@</code>. <span class="ws">B1</span> <code>WorkspaceSummary.stack</code></li>
<li><b>Health</b> — files on disk not yet snapshotted (read without snapshotting), conflicts in the stack, and the last operation. <span class="ws">B1</span> <code>unsnapshottedFiles</code> <code>lastOp</code> <code>stack.conflicts</code></li>
<li><b>Overlap warning</b> — two stacks change the same file, so they will likely conflict when they land; Compare opens one per-commit range view of both stacks, filtered to the shared files. <span class="ws">B1</span> <span class="ws">B7</span> <code>WorkspaceSummary.overlaps</code> <code>POST /api/v1/views</code> (range, per-commit)</li>
<li><b>Open @ and Review stack</b> — a snapshot of the workspace's @ with its live files, or a range view of its stack. <span class="ws f">F4</span> <code>POST /api/v1/views</code> <code>{ mode: "snapshot", rev: "tax@", options: { workspace: "tax" } }</code></li>
<li><b>Workspace snapshot</b> — the canvas shows tax's files as they are on its disk; edited windows are marked live, and files the default workspace also changes are flagged. <span class="ws f">F1</span> <span class="ws f">F2</span> <code>WindowHeader.flags</code> (unsnapshotted, alsoChangedIn)</li>
<li><b>Agent presence by workspace</b> — each agent marker is labelled agent@workspace with its last tool, next to your own selection. <span class="ws f">F1</span> <span class="ws">B9</span> <code>ws: agent.attention</code> (workspace)</li>
</ol></figcaption></figure>
