name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  JJ_VERSION: "0.45.1" # pinned with jj-lib (WORKSTREAMS rule 5)
  JJ_USER: ci
  JJ_EMAIL: ci@example.invalid

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install jj ${{ env.JJ_VERSION }}
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 755 "$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name jj | head -1)" /usr/local/bin/jj
          jj --version
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: CI gate (fmt, clippy, test, D13 core-deps check, web typecheck/test/build)
        run: scripts/ci.sh

  e2e:
    # The UI end to end: review-flow and panels-flow in headless Chrome, against cv-mock and against
    # `cv serve` on a generated fixture repo (scripts/ci-e2e.sh; no private repo needed).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install jj ${{ env.JJ_VERSION }}
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 755 "$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name jj | head -1)" /usr/local/bin/jj
          jj --version
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: E2E (build, cv-mock and cv serve on a fixture repo, review-flow and panels-flow)
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
        run: scripts/ci-e2e.sh

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
